<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Chris 的个人主页</title>
  <desc id="desc">暖色夕阳、缓慢移动的云和轻轻摇摆的植物</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff7e8"/>
      <stop offset=".55" stop-color="#ffd7c2"/>
      <stop offset="1" stop-color="#c9d8b6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#82966f"/>
      <stop offset="1" stop-color="#53684b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .cloud { animation: drift 16s ease-in-out infinite alternate; }
      .cloud.slow { animation-duration: 22s; animation-delay: -7s; }
      .leaf { transform-origin: bottom center; animation: sway 3.8s ease-in-out infinite alternate; }
      .leaf.late { animation-delay: -1.9s; }
      .spark { animation: blink 2.8s ease-in-out infinite; }
      .spark.late { animation-delay: -1.4s; }
      @keyframes drift { to { transform: translateX(34px); } }
      @keyframes sway { to { transform: rotate(4deg); } }
      @keyframes blink { 50% { opacity: .25; transform: translateY(-3px); } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#sky)"/>
  <circle cx="965" cy="88" r="58" fill="#ffb36b" opacity=".35" filter="url(#soft)"/>
  <circle cx="965" cy="88" r="40" fill="#ffb36b"/>

  <g class="cloud" fill="#fff" opacity=".72">
    <ellipse cx="850" cy="82" rx="70" ry="18"/>
    <ellipse cx="820" cy="70" rx="34" ry="25"/>
    <ellipse cx="870" cy="64" rx="43" ry="30"/>
  </g>
  <g class="cloud slow" fill="#fff" opacity=".48">
    <ellipse cx="185" cy="88" rx="58" ry="15"/>
    <ellipse cx="160" cy="79" rx="29" ry="21"/>
    <ellipse cx="202" cy="73" rx="34" ry="25"/>
  </g>

  <path d="M0 286C180 223 300 267 440 246s231-87 377-42 240 12 383-18v174H0Z" fill="#a9b994"/>
  <path d="M0 315c172-60 315-13 463-40s226-62 354-18 230 24 383-18v121H0Z" fill="url(#hill)"/>

  <g class="leaf" fill="#40543c">
    <path d="M91 360c-4-67 12-113 34-152-7 49-12 98-9 152Z"/>
    <path d="M108 290c-41-15-47-48-48-69 35 14 49 35 48 69Z"/>
    <path d="M116 265c33-19 45-47 46-70-29 12-45 36-46 70Z"/>
  </g>
  <g class="leaf late" fill="#64765a">
    <path d="M1090 360c3-72-9-118-31-151 8 50 10 101 7 151Z"/>
    <path d="M1073 288c42-16 49-47 50-68-35 12-50 34-50 68Z"/>
    <path d="M1066 263c-31-17-44-42-45-64 28 11 43 33 45 64Z"/>
  </g>

  <g fill="#fff8e7">
    <circle class="spark" cx="268" cy="88" r="4"/>
    <circle class="spark late" cx="1040" cy="170" r="3"/>
    <circle class="spark" cx="734" cy="63" r="3"/>
  </g>

  <text x="96" y="154" fill="#4c4038" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="74" font-weight="700" letter-spacing="8">CHRIS</text>
  <text x="101" y="205" fill="#65564c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" letter-spacing="3">做点有用的，留点好玩的。</text>
</svg>
