      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="100" r="3" fill="#5eead4" opacity="0.9"/>
    <circle cx="180" cy="80" r="4" fill="#0ea5a0" opacity="0.4">
      <animate attributeName="r" values="4;10;4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="80" r="2" fill="#2dd4bf" opacity="0.7"/>
    <circle cx="300" cy="60" r="1.5" fill="#2dd4bf" opacity="0.5">
      <animate attributeName="cy" values="60;50;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="250" r="1" fill="#0ea5a0" opacity="0.4">
      <animate attributeName="cy" values="250;240;250" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="50" r="1.5" fill="#5eead4" opacity="0.3">
      <animate attributeName="cy" values="50;42;50" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#2dd4bf" stroke-width="1" opacity="0.15">
      <animate attributeName="y1" values="0;320;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;320;0" dur="8s" repeatCount="indefinite"/>
    </line>
    <line x1="880" y1="180" x2="1100" y2="180" stroke="#0ea5a0" stroke-width="1" opacity="0.2"/>
    <line x1="920" y1="200" x2="1060" y2="200" stroke="#0ea5a0" stroke-width="1" opacity="0.15"/>
    <line x1="960" y1="220" x2="1040" y2="220" stroke="#0ea5a0" stroke-width="1" opacity="0.1"/>
    <g opacity="0.25" stroke="#2dd4bf" stroke-width="1">
      <line x1="145" y1="200" x2="155" y2="200"/>
      <line x1="150" y1="195" x2="150" y2="205"/>
    </g>
    <g opacity="0.2" stroke="#0ea5a0" stroke-width="1">
      <line x1="1100" y1="250" x2="1110" y2="250"/>
      <line x1="1105" y1="245" x2="1105" y2="255"/>
    </g>
    <text x="80" y="140" fill="#e2e8f0" font-family="'SF Mono', 'Fira Code', 'Consolas', 'Microsoft YaHei', monospace" font-size="72" font-weight="700" letter-spacing="6">CHRIS</text>
    <text x="84" y="178" fill="#7a9ba8" font-family="'SF Mono', 'Fira Code', 'Consolas', 'Microsoft YaHei', monospace" font-size="18" letter-spacing="1">做点有用的，留点好玩的。</text>
    <rect x="84" y="196" width="48" height="2" rx="1" fill="#2dd4bf" filter="url(#glow)" opacity="0.9"/>
    <text x="84" y="230" fill="#3d5a6e" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" letter-spacing="3">ENGINEER / BUILDER</text>
