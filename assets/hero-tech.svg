        <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.2"/>
      </g>
    </g>
    <circle cx="1020" cy="100" r="8" fill="#2dd4bf" opacity="0.6">
