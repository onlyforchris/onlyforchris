<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <clipPath id="cardClip">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d3d" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="nebula" cx="0.15" cy="0.85" r="0.45">
      <stop offset="0%" stop-color="#0ea5a0" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#134e6f" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1520" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="0.08" cy="0.75" r="0.3">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="320" fill="#0d1520"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="950" cy="100" r="200" fill="#0ea5a0" opacity="0.06"/>
    <circle cx="200" cy="250" r="150" fill="#0ea5a0" opacity="0.04"/>
    <rect width="1200" height="320" fill="url(#nebula)"/>
    <rect width="1200" height="320" fill="url(#nebula2)"/>
    <circle cx="60" cy="220" r="1.2" fill="#e2e8f0" opacity="0.7"/>
