    <circle cx="200" cy="225" r="1.3" fill="#e2e8f0" opacity="0.65"/>
    <circle cx="240" cy="260" r="0.9" fill="#c8dce4" opacity="0.5"/>
    <circle cx="280" cy="230" r="1.1" fill="#e2e8f0" opacity="0.55"/>
    <circle cx="310" cy="270" r="0.8" fill="#a0c4d0" opacity="0.45"/>
    <circle cx="350" cy="245" r="1" fill="#e2e8f0" opacity="0.5"/>
