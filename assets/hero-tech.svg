    <circle cx="420" cy="255" r="1.2" fill="#e2e8f0" opacity="0.55"/>
    <circle cx="460" cy="290" r="0.9" fill="#a0c4d0" opacity="0.35"/>
    <circle cx="500" cy="265" r="0.8" fill="#e2e8f0" opacity="0.4"/>
