    <circle cx="760" cy="230" r="0.6" fill="#e2e8f0" opacity="0.2"/>
    <circle cx="820" cy="260" r="0.7" fill="#a0c4d0" opacity="0.2"/>
    <g stroke="#2dd4bf" stroke-width="0.5" opacity="0.12">
