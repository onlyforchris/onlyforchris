<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Chris — 做点有用的，留点好玩的。</title>
  <desc id="desc">明亮的文件桌面，HTML 演示、Python 工具与 Markdown 笔记并列摆放。</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dbe3ec"/></pattern>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#223b59" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#f3f6fa"/>
  <rect x="650" width="550" height="320" rx="18" fill="url(#dots)"/>
  <g font-family="Avenir Next, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="48" y="43" width="7" height="18" rx="3" fill="#1765db"/>
    <text x="68" y="57" font-size="13" letter-spacing="2" fill="#607082">ONLYFORCHRIS</text>
    <text x="44" y="147" font-size="78" font-weight="750" letter-spacing="-3" fill="#192b3a">Chris.</text>
    <text x="48" y="216" font-size="30" font-weight="600" fill="#192b3a">做点有用的，留点好玩的。</text>
    <text x="49" y="270" font-size="15" fill="#607082">工具 / 演示 / 项目里的笔记</text>
    <g filter="url(#shadow)" transform="translate(720 62) rotate(-9 85 95)">
      <rect width="156" height="196" rx="12" fill="#e3edff" stroke="#c4d7f7"/>
      <text x="20" y="42" font-family="SFMono-Regular, Consolas, monospace" font-size="17" fill="#235aad">.html</text>
      <rect x="20" y="62" width="116" height="68" rx="5" fill="#1a304b"/>
      <path d="M64 81 84 96 64 111Z" fill="#c5ddff"/>
      <text x="20" y="168" font-size="15" fill="#235aad">演示</text>
    </g>
    <g filter="url(#shadow)" transform="translate(875 49) rotate(7 82 100)">
      <rect width="156" height="196" rx="12" fill="#e5f2ec" stroke="#c8dfd3"/>
      <text x="20" y="42" font-family="SFMono-Regular, Consolas, monospace" font-size="17" fill="#28654e">.py</text>
      <path d="m37 77-16 15 16 15m81-30 16 15-16 15m-33-36-17 62" fill="none" stroke="#57917b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="168" font-size="15" fill="#28654e">工具</text>
    </g>
    <g filter="url(#shadow)" transform="translate(1008 87) rotate(-3 75 90)">
      <rect width="148" height="188" rx="12" fill="#fff" stroke="#dce3ec"/>
      <text x="20" y="42" font-family="SFMono-Regular, Consolas, monospace" font-size="17" fill="#607082">.md</text>
      <rect x="20" y="65" width="72" height="7" rx="3" fill="#8495aa"/>
      <path d="M20 91h106M20 109h91M20 127h102" stroke="#d8e0e9" stroke-width="5" stroke-linecap="round"/>
      <text x="20" y="163" font-size="15" fill="#607082">笔记</text>
    </g>
  </g>
</svg>
