      <line x1="310" y1="270" x2="350" y2="245"/>
      <line x1="350" y1="245" x2="420" y2="255"/>
    </g>
    <circle cx="130" cy="210" r="2" fill="#5eead4" opacity="0.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="230" r="1.8" fill="#2dd4bf" opacity="0.7" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="300" r="1.5" fill="#5eead4" opacity="0.6" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="255" r="1.8" fill="#2dd4bf" opacity="0.65" filter="url(#glow)">
      <animate attributeName="opacity" values="0.65;0.2;0.65" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="305" r="1.5" fill="#5eead4" opacity="0.5" filter="url(#glow)">
