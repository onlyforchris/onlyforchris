    <circle cx="120" cy="290" r="0.7" fill="#a0c4d0" opacity="0.4"/>
    <circle cx="160" cy="280" r="1.1" fill="#e2e8f0" opacity="0.45"/>
    <circle cx="210" cy="300" r="0.8" fill="#c8dce4" opacity="0.35"/>
    <circle cx="260" cy="290" r="1" fill="#e2e8f0" opacity="0.4"/>
    <circle cx="330" cy="305" r="0.7" fill="#a0c4d0" opacity="0.3"/>
    <circle cx="380" cy="310" r="0.9" fill="#e2e8f0" opacity="0.35"/>
